spring:
  application:
    name: bt-ms-customers
  cloud:
    config:
      uri: http://localhost:9001
      profile: dev
      enabled: true

# Eureka Client Configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: false

